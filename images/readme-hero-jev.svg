<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- README "New: Jev" hero. Source for images/readme-hero-jev.png (npx tsx scripts/generate-jev-hero-image.ts).
       Designed for Inter + JetBrains Mono; falls back to system fonts. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#070a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#31a8ff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#31a8ff" stop-opacity="0"/>
    </radialGradient>
    <!-- Photoshop transparency grid, faded toward the panel edges -->
    <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#ffffff" fill-opacity="0.028"/>
      <rect x="12" y="12" width="12" height="12" fill="#ffffff" fill-opacity="0.028"/>
    </pattern>
    <radialGradient id="checkerFade" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="checkerMask">
      <rect x="860" y="130" width="640" height="540" fill="url(#checkerFade)"/>
    </mask>
    <clipPath id="panelClip">
      <rect x="860" y="130" width="640" height="540" rx="28"/>
    </clipPath>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#31a8ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#3a4a68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <circle cx="1180" cy="400" r="560" fill="url(#glow)"/>

  <!-- ───────────── Left: message ───────────── -->
  <g font-family="Inter, -apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- brand row -->
    <g transform="translate(120,158)">
      <rect width="44" height="44" rx="10" fill="#001e36" stroke="#1d3d63" stroke-width="1.5"/>
      <text x="22" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#31a8ff">Ps</text>
    </g>
    <text x="180" y="188" font-size="22" font-weight="600" fill="#f2f5fa">Photoshop MCP</text>
    <rect x="368" y="168" width="1.5" height="24" fill="#2a3653"/>
    <text x="386" y="188" font-size="22" font-weight="500" fill="#9aa7bd">Jev intent routing</text>

    <!-- headline -->
    <text x="116" y="318" font-size="62" font-weight="700" letter-spacing="-1.6" fill="#f2f5fa">The fastest LLM call</text>
    <text x="116" y="394" font-size="62" font-weight="700" letter-spacing="-1.6" fill="#f2f5fa">is the one you <tspan fill="#31a8ff">skip.</tspan></text>

    <!-- subhead -->
    <text font-size="23" font-weight="400" fill="#9aa7bd">
      <tspan x="120" y="466">In the built-in chat, Jev from TypeSafe AI reads</tspan>
      <tspan x="120" y="502">every prompt first. Safe one-step edits run in</tspan>
      <tspan x="120" y="538">Photoshop right away, with no LLM in the loop.</tspan>
    </text>

    <!-- opt-in line -->
    <g transform="translate(120,596)">
      <rect width="210" height="40" rx="10" fill="#0f1628" stroke="#22304d" stroke-width="1.5"/>
      <text x="18" y="26" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="500" fill="#c9d3e6">TYPESAFE_API_KEY</text>
      <text x="230" y="26" font-size="18" font-weight="400" fill="#5c6b84">Opt-in. Off by default.</text>
    </g>
  </g>

  <!-- ───────────── Right: routing diagram ───────────── -->
  <g transform="translate(-20,0)">
  <rect x="860" y="130" width="640" height="540" rx="28" fill="#0c1324" stroke="#1a2540" stroke-width="1.5"/>
  <g clip-path="url(#panelClip)">
    <rect x="860" y="130" width="640" height="540" fill="url(#checker)" mask="url(#checkerMask)"/>
  </g>

  <g font-family="Inter, -apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- prompt input -->
    <rect x="900" y="170" width="560" height="64" rx="16" fill="#111a2e" stroke="#26345a" stroke-width="1.5"/>
    <text x="928" y="210" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#e6ebf5">set layer opacity to 60%</text>
    <rect x="1252" y="188" width="2" height="28" rx="1" fill="#31a8ff"/>

    <!-- input → Jev -->
    <line x1="952" y1="234" x2="952" y2="294" stroke="#31a8ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- dim routes: shared trunk from Jev, branch into the LLM -->
    <g fill="none" stroke="#2c3a58" stroke-width="2" stroke-linecap="round">
      <path d="M952 356 V420 Q952 440 972 440 H1386" marker-end="url(#arrowDim)"/>
      <path d="M952 356 V500 Q952 520 972 520 H1386" marker-end="url(#arrowDim)"/>
      <path d="M952 356 V580 Q952 600 972 600 H1386" marker-end="url(#arrowDim)"/>
    </g>

    <!-- instant route: straight to Photoshop -->
    <line x1="1004" y1="328" x2="1386" y2="328" stroke="#31a8ff" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

    <!-- Jev node -->
    <rect x="900" y="300" width="104" height="56" rx="14" fill="#0f2140" stroke="#31a8ff" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="952" y="336" text-anchor="middle" font-size="24" font-weight="600" fill="#f2f5fa">Jev</text>

    <!-- instant labels -->
    <text x="1030" y="312" font-size="21" font-weight="600" fill="#31a8ff">Instant<tspan dx="10" font-size="18" font-weight="400" fill="#9aa7bd">no LLM call</tspan></text>
    <rect x="1030" y="342" width="132" height="32" rx="9" fill="#0f2140" stroke="#1f4270" stroke-width="1"/>
    <text x="1096" y="364" text-anchor="middle" font-size="16" font-weight="500" fill="#bcd9f5">Opacity 60%</text>

    <!-- dim route labels -->
    <text x="1000" y="428" font-size="20" font-weight="600" fill="#b3bdd0">Plan<tspan dx="10" font-size="17" font-weight="400" fill="#66758f">several steps, or merge / flatten</tspan></text>
    <text x="1000" y="508" font-size="20" font-weight="600" fill="#b3bdd0">Look &amp; iterate<tspan dx="10" font-size="17" font-weight="400" fill="#66758f">has to see the image</tspan></text>
    <text x="1000" y="588" font-size="20" font-weight="600" fill="#b3bdd0">Ask first<tspan dx="10" font-size="17" font-weight="400" fill="#66758f">too vague to act on</tspan></text>

    <!-- LLM -->
    <rect x="1392" y="412" width="68" height="216" rx="14" fill="#111a2e" stroke="#26345a" stroke-width="1.5"/>
    <text x="1426" y="526" text-anchor="middle" font-size="18" font-weight="600" fill="#6b7a94">LLM</text>
    <line x1="1426" y1="410" x2="1426" y2="370" stroke="#2c3a58" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#arrowDim)"/>

    <!-- Photoshop -->
    <rect x="1392" y="294" width="68" height="68" rx="14" fill="#001e36" stroke="#31a8ff" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="1426" y="339" text-anchor="middle" font-size="29" font-weight="700" fill="#31a8ff">Ps</text>
  </g>
  </g>
</svg>
