version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Major upgrades are done deliberately by a maintainer, not by Dependabot.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Major upgrades are done deliberately by a maintainer, not by Dependabot.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    ignore:
      # Major upgrades are done deliberately by a maintainer, not by Dependabot.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      github-actions:
        patterns: ['*']
