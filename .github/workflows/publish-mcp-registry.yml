# Publish server.json to the Official MCP Registry without re-publishing to npm.
# Use when npm is already live but registry metadata is stale. See CONTRIBUTING.md.
name: Publish MCP Registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish metadata for (e.g. v1.7.2)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          package-manager-cache: false

      # Tags created before package-lock.json was committed have no lockfile.
      - name: Install dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Sync server.json with package.json
        run: npm run sync:server-version

      - name: Assert server.json version matches tag
        run: |
          TAG_VERSION="${{ inputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          SERVER_VERSION="$(node -p "require('./server.json').version")"
          if [[ "$SERVER_VERSION" != "$TAG_VERSION" ]]; then
            echo "server.json version ($SERVER_VERSION) does not match tag ($TAG_VERSION)" >&2
            exit 1
          fi

      - name: Install MCP Publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
