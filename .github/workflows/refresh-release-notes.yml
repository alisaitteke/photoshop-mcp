# Rebuild GitHub Release notes for an existing tag — run after npm publish so the
# release body shows "✅ Published on npm." See CONTRIBUTING.md § Releasing.
name: Refresh Release Notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to refresh (e.g. v1.3.9)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  refresh-release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Refresh release notes
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          NPM_WAIT_FOR_VERSION: "1"
        run: bash scripts/refresh-release-notes.sh "$TAG"
