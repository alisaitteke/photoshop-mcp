# Rebuild GitHub Release notes for an existing tag — run after npm publish so the
# release body shows "✅ Published on npm." See CONTRIBUTING.md § Releasing.
name: Refresh Release Notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to refresh (e.g. v1.3.9)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  refresh-release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Refresh release notes
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          NPM_WAIT_FOR_VERSION: "1"
        run: bash scripts/refresh-release-notes.sh "$TAG"
