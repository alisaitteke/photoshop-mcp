# PRs are squash-merged, so the PR title becomes the commit subject on master.
# scripts/build-release-notes.sh groups release notes by these prefixes.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            chore
            perf
            test
            ci
            build
            revert
          requireScope: false
          subjectPattern: ^.+$
