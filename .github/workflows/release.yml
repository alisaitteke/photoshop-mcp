# Creates a GitHub Release when a version tag (v*) is pushed, then publishes to
# npm and the Official MCP Registry. See CONTRIBUTING.md § Releasing.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Validate release tag
        run: |
          PREV=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          bash scripts/validate-release-tag.sh "${GITHUB_REF_NAME}" "${PREV}"

      - name: Build release notes
        id: notes
        run: |
          PREV=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          BODY=$(bash scripts/build-release-notes.sh "${GITHUB_REF_NAME}" "${PREV}")
          { echo "body<<EOF"; echo "$BODY"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      # Tags created before package-lock.json was committed have no lockfile.
      - name: Install dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build Claude Desktop bundle
        run: npm run build:mcpb

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          # photoshop-mcp.mcpb is the stable filename the site's one-click
          # Claude Desktop button points at (releases/latest/download/...).
          files: |
            release/photoshop-mcp-*.mcpb
            release/photoshop-mcp.mcpb

  publish:
    needs: github-release
    runs-on: ubuntu-latest
    # Requires approval from a reviewer of the "release" environment
    # (Settings → Environments) before anything is published to npm.
    environment: release
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release tag
        run: |
          PREV=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          bash scripts/validate-release-tag.sh "${GITHUB_REF_NAME}" "${PREV}"

      # Tags created before package-lock.json was committed have no lockfile.
      - name: Install dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Lint
        run: npm run lint

      - name: Verify prompt coverage
        run: npm run verify:photoshop-prompts

      - name: Verify tool counts in docs
        run: npm run verify:tool-counts

      - name: Verify packed ESM imports
        run: npm run verify:pack

      - name: Sync server.json with package.json
        run: npm run sync:server-version

      - name: Assert server.json version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SERVER_VERSION="$(node -p "require('./server.json').version")"
          if [[ "$SERVER_VERSION" != "$TAG_VERSION" ]]; then
            echo "server.json version ($SERVER_VERSION) does not match tag ($TAG_VERSION)" >&2
            exit 1
          fi

      - name: Publish to npm
        id: npm_publish
        continue-on-error: true
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm version (publish-time scan)
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/wait-for-npm-version.sh "@alisaitteke/photoshop-mcp" "${TAG_VERSION}"

      - name: Verify npm publish (allow already-published version)
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${{ steps.npm_publish.outcome }}" == "success" ]]; then
            echo "Published @alisaitteke/photoshop-mcp@${TAG_VERSION} to npm."
          else
            echo "npm publish step failed, but ${TAG_VERSION} is available on npm (re-run or scan window)."
          fi

      - name: Refresh release notes (npm published)
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_PUBLISHED: "1"
        run: bash scripts/refresh-release-notes.sh "${GITHUB_REF_NAME}"

      - name: Install MCP Publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish to MCP Registry
        id: mcp_registry_publish
        continue-on-error: true
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Report MCP Registry publish status
        if: always()
        run: |
          if [[ "${{ steps.mcp_registry_publish.outcome }}" == "success" ]]; then
            echo "MCP Registry metadata published."
            exit 0
          fi
          echo "::warning::npm publish succeeded but MCP Registry publish failed. Re-run the publish job or run the Publish MCP Registry workflow for ${GITHUB_REF_NAME}."
          exit 0
