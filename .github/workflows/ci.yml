# Runs on every pull request and on pushes to master. These jobs are the
# required status checks in the "master protection" ruleset.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # `prepare` runs `npm run build` (server + web UI), so this step also
      # verifies that the project builds from a clean checkout.
      - name: Install dependencies and build
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Verify prompt coverage
        run: npm run verify:photoshop-prompts

      - name: Verify tool counts in docs
        run: npm run verify:tool-counts

      - name: Verify packed ESM imports
        run: npm run verify:pack
